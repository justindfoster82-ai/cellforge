<style>

px 40px #7c89f025;font-size:15px;font-weight:650}.forge-start small{display:block;color:#788ba7;font-size:10px;letter-spacing:1px;margin-top:22px}.forge-start small.demo{color:#ffd479;margin-top:8px}.forge-start.leaving{animation:forgeOut .35s ease forwards;pointer-events:none}@keyframes forgeOrbit{to{transform:rotate(360deg)}}@keyframes forgeOut{to{opacity:0;transform:scale(1.035)}}
.forge-flask{width:108px;height:126px;overflow:visible;filter:drop-shadow(0 0 9px #6de9ff55)}.flask-cell{transform-box:fill-box;transform-origin:center;animation:cellFloat 3.8s ease-in-out infinite}.cell-two{animation-delay:-1.3s}.cell-three{animation-delay:-2.6s}.flask-wave{animation:liquidSway 6s ease-in-out infinite alternate}.flask-fizz{animation:fizzRise 4s ease-in infinite;opacity:0}.fizz-two{animation-delay:1.5s}.fizz-three{animation-delay:2.7s}
@keyframes cellFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.04)}}@keyframes liquidSway{from{transform:translateX(-10px)}to{transform:translateX(10px)}}@keyframes fizzRise{0%{opacity:0;transform:translateY(0)}20%{opacity:.8}80%{opacity:.6}100%{opacity:0;transform:translateY(-45px)}}

oke-width="3"/><circle cx="80" cy="109" r="3.4" fill="#e4c8ff"/></g></svg></div><div class="eyebrow">BUILT AROUND YOU</div><h1>Cell<span>forge</span></h1><p>Your protocols. Your progress.<br>A clearer picture, every day.</p><button class="forge-enter" onclick="enter()">Enter Cellforge <span aria-hidden="true">→</span></button><small>PERSONAL JOURNAL · ON-DEVICE STORAGE</small><small class="demo">PREVIEW · DEMO DATA</small></div></div>

<script>
const KEY='cellforge.preview.v1',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)},addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const TODAY=ymd(new Date()),DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt=s=>{const d=pd(s);return DN[d.getDay()]+', '+MN[d.getMonth()]+' '+d.getDate()},r1=x=>Math.round(x*10)/10,r2=x=>Math.round(x*100)/100;
const t12=t=>{let[h,m]=t.split(':').map(Number);return (h%12||12)+':'+pad(m)+' '+(h<12?'AM':'PM')};
function demo(){return{v:1,theme:'aurora',anim:true,logs:[],vitals:[],prots:[
{id:'reta',name:'Retatrutide',unit:'mg',vial:20,bac:2,dose:4,time:'09:00',start:'2026-10-24',end:'',mixed:'2026-10-23',stepDate:'',stepDose:'',sched:{t:'dow',d:[6]},notes:'Weekly. Time is a placeholder.'},
{id:'ghk',name:'GHK-Cu',unit:'mg',vial:100,bac:3,dose:1,time:'16:30',start:'2026-10-23',end:'',mixed:'',stepDate:'2026-10-30',stepDose:2,sched:{t:'dow',d:[1,2,3,4,5]},notes:'SubQ. Sat/Sun off.'}]}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.prots)S=demo();
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const conc=p=>p.vial/p.bac,doseOn=(p,d)=>(p.stepDate&&p.stepDose&&d>=p.stepDate)?+p.stepDose:+p.dose,units=(p,dose)=>r1(dose/conc(p)*100);
function due(p,d){if(d<p.start||(p.end&&d>p.end))return false;if(p.sched.t==='dow')return p.sched.d.includes(pd(d).getDay());return Math.round((pd(d)-pd(p.start))/864e5)%p.sched.n===0}
const taken=(p,d)=>S.logs.find(l=>l.pid===p.id&&l.date===d);
function vialInfo(p){let rem=p.vial-S.logs.filter(l=>l.pid===p.id&&(!p.mixed||l.date>=p.mixed)).reduce((a,l)=>a+l.dose,0),d=TODAY,left=0,last=null;
 for(let i=0;i<1500;i++){if(due(p,d)&&!taken(p,d)){const x=doseOn(p,d);if(rem+1e-9<x)break;rem-=x;left++;last=d}d=addD(d,1);if(p.end&&d>p.end)break}
 return{left,last,spare:r2(rem),total:Math.max(1,Math.floor(p.vial/p.dose))}}
const items=d=>S.prots.filter(p=>due(p,d)).sort((a,b)=>a.time.localeCompare(b.time));

let tab=location.hash.slice(1)||'today',cm=null,libQ='',libC='';

function go(k){const sw=k!==tab;tab=k;history.replaceState(null,'','#'+k);R();scrollTo(0,0);if(sw){const v=$('#v');v.classList.remove('sw');void v.offsetWidth;v.classList.add('sw')}}
function enter(fast){const t=$('#title');if(!t)return;try{sessionStorage.setItem('cf.entered','1')}catch(e){}if(fast){t.remove();return}t.classList.add('leaving');setTimeout(()=>t.remove(),(!S.anim||matchMedia('(prefers-reduced-motion: reduce)').matches)?0:350)}
function ringH(f,big,sub,cls){const sz=cls?48:78,r=sz/2-5,c=2*Math.PI*r;return`<div class="ring ${cls||''}" style="width:${sz}px;height:${sz}px"><svg viewBox="0 0 ${sz} ${sz}"><circle class="bgc" cx="${sz/2}" cy="${sz/2}" r="${r}" stroke-width="${cls?5:7}"/><circle class="fg" cx="${sz/2}" cy="${sz/2}" r="${r}" stroke-width="${cls?5:7}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.max(0,Math.min(1,f)))}" style="--c:${c}"/></svg><div>${big}<small>${sub}</small></div></div>`}
function boom(){if(!S.anim||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const b=document.createElement('div');b.className='boom';const C=['#00e5ff','#a855f7','#ff3cac','#00e676','#ffd479'];let h='<b>✓</b>';for(let i=0;i<26;i++){const a=Math.random()*Math.PI*2,d=80+Math.random()*120;h+=`<i style="background:${C[i%5]};--x:${Math.cos(a)*d|0}px;--y:${Math.sin(a)*d|0}px"></i>`}b.innerHTML=h;document.body.append(b);setTimeout(()=>b.remove(),1000)}
document.addEventListener('pointerdown',e=>{const btn=e.target.closest('button');if(!btn||!S.anim)return;const r=btn.getBoundingClientRect(),d=Math.max(r.width,r.height),sp=document.createElement('span');sp.className='rip';sp.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;btn.append(sp);setTimeout(()=>sp.remove(),500)});
const ttl=(k,t)=>`<h1>${t}</h1>`;
const V={
today(){const it=items(TODAY),tk=it.filter(p=>taken(p,TODAY)).length,ms=missed();let strip='';for(let i=-3;i<=3;i++){const d=addD(TODAY,i),x=items(d);strip+=`<div class="day ${i?'':'on'}">${DN[pd(d).getDay()]}<b>${pd(d).getDate()}</b><div class="dots">${x.map(p=>`<span class="dot ${taken(p,d)?'t':d<TODAY?'m':''}"></span>`).join('')}</div></div>`}
 return ttl('','Today')+`<div class="card hero"><div><div class="lbl">Your daily overview</div><h2>Stay in rhythm.<br><i>See the whole picture.</i></h2><div class="mut">${fmt(TODAY)}, ${pd(TODAY).getFullYear()}<br>${it.length-tk} unrecorded · ${tk} taken</div></div>${ringH(it.length?tk/it.length:0,tk+'/'+it.length,'taken')}</div>
 <div class="stats"><div class="card"><div class="lbl">Protocols</div><b>${S.prots.length}</b><div class="mut">In your collection</div></div><div class="card"><div class="lbl">Recorded</div><b>${S.logs.length}</b><div class="mut">Total taken</div></div><div class="card"><div class="lbl">Today</div><b>${it.length-tk}</b><div class="mut">Unrecorded</div></div></div>
 <div class="strip">${strip}</div><h3 class="sec">Today's schedule <span style="float:right;letter-spacing:0;text-transform:none">${it.length} scheduled</span></h3>
 ${it.map(p=>{const x=doseOn(p,TODAY),t=taken(p,TODAY);return`<div class="card dose ${t?'done':''}"><div><b>${esc(p.name)}</b><div class="mut">${fmt(TODAY)} · ${p.time} · ${x} ${p.unit} · <b style="font-size:12.5px;color:var(--tx)">${units(p,x)} units</b></div></div>${t?'<span class="mut">✓ Taken</span>':`<button class="go" onclick="mark('${p.id}','${TODAY}')">Mark taken</button>`}</div>`}).join('')||'<div class="card mut">Nothing scheduled today.</div>'}
 ${ms.length?`<h3 class="sec">Missed</h3>`+ms.map(({p,d})=>{const x=doseOn(p,d);return`<div class="card dose miss"><div><b>${esc(p.name)}</b><div class="mut">${fmt(d)} · ${p.time} · ${x} ${p.unit} · ${units(p,x)} units</div></div><button class="go" onclick="mark('${p.id}','${d}')">Log late</button></div>`}).join(''):''}`},
protocols(){return ttl('','Protocols')+`<button class="grad" style="margin-bottom:12px" onclick="edit()">+ Add peptide</button>`+S.prots.map(p=>{const v=vialInfo(p),sc=p.sched.t==='dow'?p.sched.d.map(i=>DN[i]).join(', '):'Every '+p.sched.n+' days',disc=p.mixed?addD(p.mixed,28):null,warn=disc&&v.last&&v.last>disc?Math.round((pd(v.last)-pd(disc))/864e5):0;
 return`<div class="card pc"><div class="ptop">${ringH(v.left/v.total,v.left,'doses','sm')}<h2>${esc(p.name)}</h2><button class="sec2" onclick="edit('${p.id}')">Edit</button></div>
 <div class="mut" style="margin-top:8px">${sc} at ${t12(p.time)} · from ${p.start}${p.end?' to '+p.end:''}</div>
 <p>Vial ${p.vial} ${p.unit} + ${p.bac} mL BAC = <b>${r2(conc(p))} ${p.unit}/mL</b></p><p>Dose ${p.dose} ${p.unit} = <b>${units(p,+p.dose)} units</b>${p.stepDate&&p.stepDose?`<br>From ${p.stepDate}: ${p.stepDose} ${p.unit} = <b>${units(p,+p.stepDose)} units</b>`:''}</p>
 <div class="mut">Mixed: ${p.mixed||'unknown'} · ${v.left} doses left (~${v.spare} ${p.unit} spare)${v.last?' · runs out after '+fmt(v.last):''}${disc?'<br>Discard by '+fmt(disc)+' (28 d)':''}</div>${warn?`<p class="warn">⚠ Last dose falls ${warn} day(s) after the 28-day discard date. Use it or start a new vial.</p>`:''}${p.notes?`<p class="mut">${esc(p.notes)}</p>`:''}</div>`}).join('')},
library(){const cats=[...new Set(LIB.map(p=>p.c))].sort();setTimeout(libDraw);return ttl('','Library')+`<input id="libs" placeholder="Search ${LIB.length} peptides…" value="${esc(libQ)}" oninput="libQ=this.value;libDraw()"><select style="margin-top:8px" onchange="libC=this.value;libDraw()"><option value="">All categories</option>${cats.map(c=>`<option ${c===libC?'selected':''}>${esc(c)}</option>`).join('')}</select><p class="mut">Educational only, not medical advice. Data compiled Oct 2026 from FDA labels, PubMed and WADA; verify before use.</p><div id="libl"></div>`},
calendar(){const b=cm||TODAY.slice(0,7)+'-01',f=pd(b),days=new Date(f.getFullYear(),f.getMonth()+1,0).getDate();let g='';for(let i=0;i<f.getDay();i++)g+='<div></div>';
 for(let i=1;i<=days;i++){const d=b.slice(0,8)+pad(i),x=items(d);g+=`<div class="day ${d===TODAY?'on':''}" style="text-align:left;padding:6px;min-height:50px"><span style="color:var(--tx)">${i}</span><div class="dots" style="justify-content:flex-start;margin-top:6px">${x.map(p=>`<span class="dot ${taken(p,d)?'t':d<TODAY?'m':''}"></span>`).join('')}</div></div>`}
 let n='';for(let i=0;i<7;i++){const d=addD(TODAY,i),x=items(d);n+=`<div class="card"><b>${fmt(d)}</b><div class="mut">${x.map(p=>`${esc(p.name)} ${doseOn(p,d)} ${p.unit} (${units(p,doseOn(p,d))} u) @ ${p.time}`).join('<br>')||'Off'}</div></div>`}
 return ttl('','Calendar')+`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><button class="sec2" onclick="mon(-1)">‹</button><b>${['January','February','March','April','May','June','July','August','September','October','November','December'][f.getMonth()]} ${f.getFullYear()}</b><button class="sec2" onclick="mon(1)">›</button></div><div class="strip" style="margin:0 0 4px">${['S','M','T','W','T','F','S'].map(x=>`<div class="mut" style="text-align:center;font-size:10px">${x}</div>`).join('')}</div><div class="strip">${g}</div><div class="mut" style="display:flex;gap:12px;font-size:11px"><span><span class="dot t" style="display:inline-block"></span> taken</span><span><span class="dot" style="display:inline-block"></span> due</span><span><span class="dot m" style="display:inline-block"></span> missed</span></div><h3 class="sec">Next 7 days</h3>${n}`},
history(){const L=[...S.logs].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));return ttl('','History')+(L.map(l=>`<div class="card dose done" style="opacity:1"><div><b>${esc(l.name)}</b><div class="mut">${fmt(l.date)} · ${l.time} · ${l.dose} ${l.unit} · ${l.units} units</div></div><button class="sec2" onclick="unlog('${l.at}')">Undo</button></div>`).join('')||'<div class="card mut">No doses logged yet. Mark a dose taken on Today.</div>')},
vitals(){const V=[...S.vitals].sort((a,b)=>a.date.localeCompare(b.date));return ttl('','Vitals')+`<div class="card"><div class="g2"><div><label>Date</label><input type="date" id="vd" value="${TODAY}"></div><div><label>Weight (lb)</label><input id="vw" inputmode="decimal"></div><div><label>Systolic</label><input id="vs" inputmode="numeric"></div><div><label>Diastolic</label><input id="vdi" inputmode="numeric"></div></div><label>Pulse (optional)</label><input id="vp" inputmode="numeric"><button class="grad" style="margin-top:12px" onclick="addV()">Save reading</button></div>
 <div class="card"><b>Weight</b>${chart(V.filter(v=>v.w),[['w','var(--ac)']])}</div><div class="card"><b>Blood pressure</b>${chart(V.filter(v=>v.s),[['s','var(--ac2)'],['d','var(--ac)']])}</div>
 ${V.length?'<h3 class="sec">Readings</h3>'+V.slice().reverse().map(v=>`<div class="card mut" style="display:flex;justify-content:space-between;align-items:center"><span>${fmt(v.date)} · ${v.w?v.w+' lb':''} ${v.s?v.s+'/'+v.d:''} ${v.p?'· '+v.p+' bpm':''}</span><button class="sec2" onclick="delV(${S.vitals.indexOf(v)})">✕</button></div>`).join(''):''}`},
tools(){return ttl('','Tools')+`<div class="card"><div class="lbl">Make it yours</div><h2 style="margin:6px 0">Choose your atmosphere.</h2><div class="mut">Color that fits your mood. Motion that stays out of your way.</div><div class="themes">${[['aurora','#9775ff','Aurora'],['ocean','#3bd5bf','Ocean'],['ember','#ff9c6c','Ember']].map(([k,c,n])=>`<button class="${S.theme===k?'on':''}" onclick="S.theme='${k}';save();R()"><span class="sw" style="background:${c}"></span>${n}</button>`).join('')}</div><button class="sec2" style="width:100%" onclick="S.anim=!S.anim;save();R()">Animations: ${S.anim?'On':'Off'}</button></div>
 <div class="card"><b>Reverse BAC calculator</b><div class="mut">How much water to add so a dose is a given number of units (U-100).</div><div class="g2"><div><label>Vial (mg/IU)</label><input id="rv" value="10" inputmode="decimal" oninput="rbac()"></div><div><label>Dose (mg/IU)</label><input id="rd" value="1" inputmode="decimal" oninput="rbac()"></div></div><label>Units wanted per dose</label><input id="ru" value="10" inputmode="decimal" oninput="rbac()"><div class="live" id="rout"></div></div>
 <div class="card"><b>Reminders</b><div class="mut">Download an .ics file with a repeating event for each protocol at its dose time. Open it on iPhone to add to Calendar.</div><button class="go" style="margin-top:10px" onclick="ics()">Export .ics reminders</button></div>
 <div class="card"><b>Backup</b><div class="mut">Export all protocols, history and vitals as JSON, or restore from a backup.</div><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="go" onclick="exp()">Export JSON</button><button class="sec2" onclick="$('#imp').click()">Import JSON</button><button class="danger" onclick="if(confirm('Reset to demo data?')){S=demo();save();R()}">Reset demo</button></div><input type="file" id="imp" accept="application/json,.json" style="display:none" onchange="imp(this)"></div>
 <p class="mut" style="text-align:center">Preview build with demo data. Stored only in this browser.</p>`}};
function libDraw(){const q=libQ.toLowerCase(),L=LIB.map((p,i)=>({p,i})).filter(({p})=>(!libC||p.c===libC)&&(!q||(p.n+' '+p.al+' '+p.what).toLowerCase().includes(q))).sort((a,b)=>a.p.c.localeCompare(b.p.c)||a.p.n.localeCompare(b.p.n));let h='',last='';for(const{p,i}of L){if(p.c!==last){h+=`<h3 class="sec">${esc(p.c)}</h3>`;last=p.c}h+=`<div class="card" onclick="libOpen(${i})" style="cursor:pointer"><b>${esc(p.n)}</b><div class="mut">${esc(p.hl.length>80?p.hl.slice(0,80)+'…':p.hl)}</div></div>`}$('#libl').innerHTML=h||'<div class="card mut">No matches.</div>'}
function libOpen(i){const p=LIB[i],F=(k,v)=>v?`<label>${k}</label><div style="font-size:14px">${esc(v)}</div>`:'';sheet(`<h2 style="margin:0">${esc(p.n)}</h2><div class="mut">${esc(p.c)}</div>${F('Half-life',p.hl)}${F('What it is',p.what)}${F('Mechanism',p.mech)}${F('Reported benefits',p.ben)}${F('Evidence level',p.ev)}${F('FDA status',p.fda)}${F('WADA status',p.wada)}${F('Common dosing (community / label)',p.dose)}${F('Key risks',p.risk)}${p.bp?`<label>Blood pressure note</label><div class="warn">${esc(p.bp)}</div>`:''}<label>Sources</label>${p.src.map(s=>`<div><a style="color:var(--ac)" target="_blank" rel="noopener" href="${esc(s[1])}">${esc(s[0])}</a></div>`).join('')}<p class="mut">Educational summary, not medical advice. Status as of Oct 2026 — verify before use.</p><button class="sec2" style="width:100%" onclick="closeS()">Close</button>`)}
function sheet(h){$('#sh').innerHTML=`<div class="sheet" onclick="if(event.target===this)closeS()"><div>${h}</div></div>`;document.body.style.overflow='hidden'}
function closeS(){$('#sh').innerHTML='';document.body.style.overflow=''}
function edit(id){const p=S.prots.find(x=>x.id===id)||{name:'',unit:'mg',vial:'',bac:'',dose:'',time:'09:00',stepDate:'',stepDose:'',start:TODAY,end:'',mixed:'',sched:{t:'dow',d:[]},notes:''},sd=p.sched.t==='dow'?p.sched.d:[];
 sheet(`<div class="lbl">${id?'Edit':'Add'} peptide</div><label>Name</label><input id="fn" value="${esc(p.name)}"><label>Units</label><select id="fu" onchange="liveC()"><option ${p.unit==='mg'?'selected':''}>mg</option><option ${p.unit==='IU'?'selected':''}>IU</option></select>
 <div class="g2"><div><label>Vial amount (mg/IU)</label><input id="fv" inputmode="decimal" value="${p.vial}" oninput="liveC()"></div><div><label>BAC water mL</label><input id="fb" inputmode="decimal" value="${p.bac}" oninput="liveC()"></div><div><label>Dose (mg/IU)</label><input id="fd" inputmode="decimal" value="${p.dose}" oninput="liveC()"></div><div><label>Time</label><input id="ft" type="time" value="${p.time}"></div><div><label>Step-up date</label><input id="fsd" type="date" value="${p.stepDate}"></div><div><label>Step-up dose (mg/IU)</label><input id="fsx" inputmode="decimal" value="${p.stepDose}"></div><div><label>Start</label><input id="fs" type="date" value="${p.start}"></div><div><label>End (optional)</label><input id="fe" type="date" value="${p.end}"></div><div><label>Date mixed</label><input id="fm" type="date" value="${p.mixed}"></div></div>
 ${id?'<div class="live" id="lc"></div>':'<div class="live" id="lc" style="font-size:14px"></div>'}<label>Schedule</label><select id="fst" onchange="$('#dw').style.display=this.value==='dow'?'':'none';$('#ev').style.display=this.value==='every'?'':'none'"><option value="dow" ${p.sched.t==='dow'?'selected':''}>Days of week</option><option value="every" ${p.sched.t==='every'?'selected':''}>Every X days</option></select>
 <div class="dows" id="dw" style="${p.sched.t==='dow'?'':'display:none'}">${DN.map((n,i)=>`<label><input type="checkbox" value="${i}" ${sd.includes(i)?'checked':''}>${n}</label>`).join('')}</div><div id="ev" style="${p.sched.t==='every'?'':'display:none'}"><label>Every how many days</label><input id="fx" inputmode="numeric" value="${p.sched.n||2}"></div>
 <label>Notes</label><textarea id="fno" rows="2">${esc(p.notes)}</textarea><div style="display:flex;gap:8px;margin-top:14px"><button class="go" style="flex:1" onclick="saveP('${id||''}')">Save</button><button class="sec2" onclick="closeS()">Cancel</button></div>${id?`<button class="danger" style="width:100%;margin-top:10px" onclick="if(confirm('Delete this protocol?')){S.prots=S.prots.filter(x=>x.id!=='${id}');save();closeS();R()}">Delete</button>`:''}`);liveC()}
function liveC(){const v=+$('#fv').value,b=+$('#fb').value,d=+$('#fd').value,u=$('#fu').value;$('#lc').textContent=v&&b?`${r2(v/b)} ${u}/mL`+(d?` · ${r1(d/(v/b)*100)} units`:''):''}
function saveP(id){const n=$('#fn').value.trim(),v=+$('#fv').value,b=+$('#fb').value,d=+$('#fd').value;if(!n||!(v>0)||!(b>0)||!(d>0))return alert('Name, vial amount, BAC water and dose are required.');
 const st=$('#fst').value,o={id:id||'p'+Date.now(),name:n,unit:$('#fu').value,vial:v,bac:b,dose:d,time:$('#ft').value||'09:00',stepDate:$('#fsd').value,stepDose:$('#fsx').value?+$('#fsx').value:'',start:$('#fs').value||TODAY,end:$('#fe').value,mixed:$('#fm').value,sched:st==='dow'?{t:'dow',d:[...document.querySelectorAll('#dw input:checked')].map(x=>+x.value)}:{t:'every',n:Math.max(1,+$('#fx').value||1)},notes:$('#fno').value};
 if(o.sched.t==='dow'&&!o.sched.d.length)return alert('Pick at least one day.');const i=S.prots.findIndex(x=>x.id===id);i>=0?S.prots[i]=o:S.prots.push(o);save();closeS();R()}
function mon(k){const f=pd(cm||TODAY.slice(0,7)+'-01');f.setMonth(f.getMonth()+k);cm=ymd(f);R()}
function unlog(at){S.logs=S.logs.filter(l=>l.at!==at);save();R()}
function addV(){const g=id=>$(id).value.trim(),o={date:g('#vd')||TODAY,w:+g('#vw')||null,s:+g('#vs')||null,d:+g('#vdi')||null,p:+g('#vp')||null};if(!o.w&&!(o.s&&o.d))return alert('Enter a weight or both blood pressure numbers.');S.vitals.push(o);save();R()}
function delV(i){S.vitals.splice(i,1);save();R()}
function chart(V,ks){if(!V.length)return'<div class="mut" style="margin-top:6px">No data yet.</div>';const all=V.flatMap(v=>ks.map(k=>v[k[0]])).filter(Boolean),lo=Math.min(...all)-5,hi=Math.max(...all)+5,W=320,H=130,x=i=>V.length<2?W/2:20+i*(W-30)/(V.length-1),y=val=>H-10-(val-lo)/(hi-lo)*(H-25);
 return`<svg class="chart" viewBox="0 0 ${W} ${H}">${ks.map(([k,c])=>`<polyline fill="none" stroke="${c}" stroke-width="2" points="${V.map((v,i)=>x(i)+','+y(v[k])).join(' ')}"/>${V.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v[k])}" r="3" fill="${c}"/><text x="${x(i)}" y="${y(v[k])-7}" fill="#97a0c3" font-size="9" text-anchor="middle">${v[k]}</text>`).join('')}`).join('')}</svg>`}
function rbac(){const v=+$('#rv').value,d=+$('#rd').value,u=+$('#ru').value;$('#rout').textContent=v&&d&&u?`Add ${r2(v*u/(d*100))} mL BAC water → ${r2(d*100/u)} mg/mL`:''}
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
function ics(){const BY=['SU','MO','TU','WE','TH','FR','SA'],L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Cellforge//Preview//EN'];S.prots.forEach(p=>{const t=p.time.replace(':','')+'00';let st=p.start;if(p.sched.t==='dow')for(let i=0;i<7&&!due(p,st);i++)st=addD(st,1);L.push('BEGIN:VEVENT','UID:'+p.id+'@cellforge','DTSTAMP:'+new Date().toISOString().replace(/[-:]|\.\d+/g,''),'DTSTART:'+st.replace(/-/g,'')+'T'+t,'DURATION:PT15M','SUMMARY:'+p.name+' '+p.dose+' '+p.unit+' ('+units(p,+p.dose)+' units)','RRULE:'+(p.sched.t==='dow'?'FREQ=WEEKLY;BYDAY='+p.sched.d.map(i=>BY[i]).join(','):'FREQ=DAILY;INTERVAL='+p.sched.n)+(p.end?';UNTIL='+p.end.replace(/-/g,'')+'T235959':''),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+p.name+' dose','TRIGGER:PT0M','END:VALARM','END:VEVENT')});L.push('END:VCALENDAR');dl('cellforge-reminders.ics',L.join('\r\n'),'text/calendar')}
function exp(){dl('cellforge-backup-'+TODAY+'.json',JSON.stringify(S,null,2),'application/json')}
function imp(el){const f=el.files[0];if(!f)return;f.text().then(t=>{const o=JSON.parse(t);if(!o.prots)throw 0;S=Object.assign(demo(),o);save();R();alert('Backup restored.')}).catch(()=>alert('That file is not a Cellforge backup.'))}
function R(){document.body.className=(S.theme||'aurora')+(S.anim?'':' motion-off');nav();$('#v').innerHTML=(V[tab]||V.today)();document.querySelectorAll('#v .card').forEach((c,i)=>c.style.setProperty('--i',i));if(tab==='tools')rbac()}
if(sessionStorage.getItem('cf.entered')||new URLSearchParams(location.search).has('skip'))enter(1);R();
</script></body></html>
